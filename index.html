<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="NumberGuessingGame.css">
</head>
<body>
    <main class="main">
        <p class="title">Number Guessing Game</p>
        <div class="box">
            <h3 class="sentence">Guess a number between 1 and 100</h3>
            <input type="number" id="guessInput" min="1" max="100">
            <button id="submitGuess">Submit Guess</button>
            <p id="message">too high</p>
            <p id="attempt">attempts:</p>
            <button id="resetButton">Play Again</button>
        </div>
    </main>




 <script src="NumberGuessingGame.js"></script>   
</body>
</html>
